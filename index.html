<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InternLoom — Smart Shortlisting Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-indigo-600 p-2 rounded-lg text-white">
          <i data-lucide="cpu" class="w-5 h-5"></i>
        </div>
        <div>
          <span class="font-bold text-lg tracking-tight text-white">InternLoom AI</span>
          <span class="text-xs text-slate-400 block -mt-1">Smart Candidate Evaluator</span>
        </div>
      </div>
      <div>
        <span class="text-xs font-mono px-3 py-1 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
          Resumes in Pool: <span id="poolBadge">3</span>
        </span>
      </div>
    </div>
  </header>

  <!-- Main Grid -->
  <main class="max-w-7xl mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
    
    <!-- Left Panel -->
    <section class="lg:col-span-5 space-y-6">
      
      <!-- JD Input -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-3">
        <h2 class="font-semibold text-slate-200 text-sm flex items-center gap-2">
          <i data-lucide="file-text" class="w-4 h-4 text-indigo-400"></i>
          1. Job Description
        </h2>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Target Requirements</label>
          <textarea id="jdText" rows="4" 
            class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs text-slate-300 focus:border-indigo-500 outline-none">Looking for a Backend Engineer with experience in Node.js, Express, MongoDB, AWS, Docker, and REST APIs. Experience writing unit tests with Jest or Mocha is required.</textarea>
        </div>
      </div>

      <!-- Add Candidate Form -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-3">
        <h2 class="font-semibold text-slate-200 text-sm flex items-center gap-2">
          <i data-lucide="user-plus" class="w-4 h-4 text-indigo-400"></i>
          2. Add Candidate Manually
        </h2>
        <input id="manualName" type="text" placeholder="Candidate Name (e.g. Sanya Gupta)" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 outline-none">
        <textarea id="manualText" rows="3" placeholder="Paste Resume text summary..." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-300 outline-none"></textarea>
        <button type="button" onclick="addCandidate()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs py-2 rounded-lg font-medium transition">
          + Add Candidate to Pool
        </button>
      </div>

      <!-- Algorithm Weights & Run Button -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4">
        <h3 class="font-semibold text-slate-200 text-sm flex items-center gap-2">
          <i data-lucide="sliders" class="w-4 h-4 text-indigo-400"></i>
          3. Algorithm Tuning
        </h3>
        <div>
          <div class="flex justify-between text-xs mb-1">
            <span class="text-slate-300">Semantic Matching Weight</span>
            <span id="semWeightText" class="font-mono text-indigo-400">60%</span>
          </div>
          <input type="range" id="semWeightSlider" min="0" max="100" value="60" oninput="updateWeightsUI()" class="w-full accent-indigo-500 h-1 bg-slate-800 rounded-lg appearance-none cursor-pointer">
        </div>

        <button type="button" onclick="evaluatePool()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-lg text-sm flex items-center justify-center gap-2 transition shadow-lg shadow-indigo-600/20">
          <i data-lucide="play" class="w-4 h-4"></i> Evaluate & Rank Candidates Live
        </button>
      </div>

    </section>

    <!-- Right Panel (Results Output) -->
    <section class="lg:col-span-7 space-y-6">
      <div class="flex items-center justify-between">
        <h2 class="font-semibold text-xl text-slate-100">Ranked Results</h2>
        <button type="button" onclick="clearPool()" class="text-xs text-rose-400 bg-rose-500/10 border border-rose-500/20 px-3 py-1 rounded-lg">
          Clear All
        </button>
      </div>

      <!-- Container where JavaScript injects output -->
      <div id="resultsContainer" class="space-y-4">
        <!-- Default State loaded via JS -->
      </div>
    </section>

  </main>

  <script>
    // Lucide Icon Initializer
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      evaluatePool(); // Run ranking immediately on startup
    });

    // Default 3 Candidates
    let currentPool = [
      {
        id: "C-101",
        name: "Aarav Sharma",
        rawText: "Built REST APIs with Express and MongoDB. Containerized applications with Docker and automated testing using Jest. Basic AWS S3 integration."
      },
      {
        id: "C-102",
        name: "Rohan Verma",
        rawText: "Software Engineer specializing in Koa backend development, Mocha testing, NoSQL MongoDB database architecture, and AWS deployment."
      },
      {
        id: "C-103",
        name: "Priya Nair",
        rawText: "Python developer proficient in Django, FastAPI, and PostgreSQL. Basic REST API architecture and Docker container management."
      }
    ];

    const semanticMap = {
      "express": "Node.js", "express.js": "Node.js", "koa": "Node.js",
      "fastapi": "Python", "django": "Python",
      "postgres": "PostgreSQL", "mongo": "MongoDB", "mongoose": "MongoDB",
      "jest": "Unit Testing", "mocha": "Unit Testing", "pytest": "Unit Testing",
      "aws": "Cloud", "docker": "DevOps"
    };

    function updateWeightsUI() {
      const val = document.getElementById('semWeightSlider').value;
      document.getElementById('semWeightText').innerText = val + "%";
    }

    function addCandidate() {
      const name = document.getElementById('manualName').value.trim();
      const text = document.getElementById('manualText').value.trim();

      if (!name || !text) {
        alert("Please enter both Candidate Name and Resume Text!");
        return;
      }

      currentPool.push({
        id: "C-" + Math.floor(100 + Math.random() * 900),
        name: name,
        rawText: text
      });

      document.getElementById('manualName').value = "";
      document.getElementById('manualText').value = "";
      document.getElementById('poolBadge').innerText = currentPool.length;
      
      evaluatePool();
    }

    function clearPool() {
      currentPool = [];
      document.getElementById('poolBadge').innerText = "0";
      document.getElementById('resultsContainer').innerHTML = `
        <div class="border border-slate-800 border-dashed rounded-xl p-8 text-center text-slate-500 text-xs">
          Pool cleared. Add candidates on the left to evaluate.
        </div>
      `;
    }

    function evaluatePool() {
      const container = document.getElementById('resultsContainer');
      if (!container) return;

      if (currentPool.length === 0) {
        container.innerHTML = `<div class="text-xs text-slate-500 text-center py-8">No candidates in pool.</div>`;
        return;
      }

      const jdText = document.getElementById('jdText').value.toLowerCase();
      const semWeight = parseInt(document.getElementById('semWeightSlider').value) / 100;
      const keyWeight = 1 - semWeight;

      const targetSkills = ["node.js", "express", "mongodb", "aws", "docker", "rest", "jest", "mocha"];

      const evaluated = currentPool.map(c => {
        const text = c.rawText.toLowerCase();
        let exact = [];
        let semantic = [];
        let missing = [];

        targetSkills.forEach(skill => {
          if (text.includes(skill)) {
            exact.push(skill.toUpperCase());
          } else {
            let foundSem = false;
            for (let [syn, core] of Object.entries(semanticMap)) {
              if (core.toLowerCase() === skill && text.includes(syn)) {
                semantic.push({ syn: syn.toUpperCase(), core: core.toUpperCase() });
                foundSem = true;
                break;
              }
            }
            if (!foundSem) missing.push(skill.toUpperCase());
          }
        });

        const keyScore = (exact.length / targetSkills.length) * 100;
        const semScore = ((exact.length + semantic.length) / targetSkills.length) * 100;
        const finalScore = Math.min(100, Math.round((semScore * semWeight) + (keyScore * keyWeight)));

        return { ...c, exact, semantic, missing, keyScore: Math.round(keyScore), semScore: Math.round(semScore), finalScore };
      });

      evaluated.sort((a, b) => b.finalScore - a.finalScore);

      container.innerHTML = evaluated.map((c, i) => `
        <div class="border rounded-xl p-5 ${i < 3 ? 'border-indigo-500/50 bg-slate-900' : 'border-slate-800 bg-slate-900/40'}">
          <div class="flex justify-between items-start">
            <div class="flex items-center gap-3">
              <span class="w-7 h-7 rounded-full ${i < 3 ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400'} flex items-center justify-center text-xs font-bold">
                #${i + 1}
              </span>
              <div>
                <h3 class="font-bold text-slate-100 text-sm">${c.name}</h3>
                <p class="text-xs text-slate-400 line-clamp-1 mt-0.5">${c.rawText}</p>
              </div>
            </div>
            <div class="text-right">
              <span class="text-base font-bold font-mono text-indigo-400">${c.finalScore}%</span>
            </div>
          </div>

          ${i < 3 ? `
            <div class="mt-4 pt-3 border-t border-slate-800 text-xs space-y-2">
              <div class="font-semibold text-indigo-400 text-[11px] uppercase tracking-wider">Top 3 Justification Report</div>
              <div class="flex flex-wrap gap-1">
                ${c.exact.map(m => `<span class="bg-emerald-500/10 text-emerald-300 border border-emerald-500/20 px-2 py-0.5 rounded text-[10px]">✓ ${m}</span>`).join('')}
                ${c.semantic.map(s => `<span class="bg-indigo-500/10 text-indigo-300 border border-indigo-500/20 px-2 py-0.5 rounded text-[10px]">≈ ${s.syn} (${s.core})</span>`).join('')}
                ${c.missing.map(m => `<span class="bg-rose-500/10 text-rose-300 border border-rose-500/20 px-2 py-0.5 rounded text-[10px]">✕ ${m}</span>`).join('')}
              </div>
            </div>
          ` : ''}
        </div>
      `).join('');

      lucide.createIcons();
    }
  </script>
</body>
</html>
